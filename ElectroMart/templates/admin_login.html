<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login - ElectroMart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* BACKGROUND */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #000428, #004e92);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* LOGIN BOX */
.container {
    background: rgba(255, 255, 255, 0.1);
    padding: 40px;
    width: 320px;
    border-radius: 15px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    color: white;
}

/* TITLE */
.container h2 {
    text-align: center;
    margin-bottom: 20px;
}

/* INPUT */
.input-box {
    margin-bottom: 15px;
}

.input-box input {
    width: 100%;
    padding: 10px;
    border: none;
    outline: none;
    border-radius: 5px;
}

/* BUTTON */
button {
    width: 100%;
    padding: 10px;
    border: none;
    background: orange;
    color: white;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: darkorange;
}

/* FLASH MESSAGE */
.message {
    text-align: center;
    color: #ffcccc;
    margin-bottom: 10px;
}

</style>
</head>

<body>

<div class="container">
    <h2>🔐 Admin Login</h2>

    <!-- FLASH MESSAGE -->
    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <div class="input-box">
            <!-- ✅ IMPORTANT (Fix for your error) -->
            <input type="text" name="username" placeholder="Enter Username" required>
        </div>

        <div class="input-box">
            <input type="password" name="password" placeholder="Enter Password" required>
        </div>

        <button type="submit">Login</button>

    </form>
</div>

</body>
</html>
