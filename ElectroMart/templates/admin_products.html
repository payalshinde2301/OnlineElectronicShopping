<!DOCTYPE html>
<html>
<head>
<title>Admin Products</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}
/* NAVBAR */
.navbar {
    background: rgba(0,0,0,0.8);
    padding: 15px 30px;
    color: white;
    display: flex;
    gap: 20px;
}

.navbar a {
    color: white;
    text-decoration: none;
    font-weight: 500;
}

.navbar a:hover {
    color: orange;
}

/* HEADER */
.header {
    background: #131921;
    color: white;
    padding: 15px 20px;
    font-size: 20px;
}

/* CONTAINER */
.container {
    padding: 20px;
}

/* ADD BUTTON */
.add-btn {
    display: inline-block;
    margin-bottom: 20px;
    padding: 10px 15px;
    background: orange;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}

.add-btn:hover {
    background: darkorange;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

/* CARD */
.card {
    background: white;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

/* IMAGE */
.card img {
    width: 100%;
    height: 150px;
    object-fit: contain;
}

/* NAME */
.card h3 {
    font-size: 16px;
    margin: 10px 0;
}

/* PRICE */
.price {
    color: green;
    font-weight: bold;
}

/* DELETE BUTTON */
.delete-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 12px;
    background: red;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}

.delete-btn:hover {
    background: darkred;
}
</style>

</head>

<body>
 <!-- NAVBAR -->
    <div class="navbar">
        <a href="/admin">Dashboard</a>
        <a href="/admin/orders">Orders</a>
        <a href="/admin/products">Products</a>
        <a href="/logout">Logout</a>
    </div>
<div class="header">
    📦 Admin Product Dashboard
</div>

<div class="container">

<a href="/admin/add_product" class="add-btn">➕ Add Product</a>

<div class="grid">

{% for p in products %}
<div class="card">

    <!-- IMAGE -->
    <img src="{{ url_for('static', filename=p[4]) }}">
    <!-- NAME -->
    <h3>{{ p[1] }}</h3>

    <!-- PRICE -->
    <p class="price">₹{{ p[3] }}</p>

    <!-- DELETE -->
    <a href="/admin/delete_product/{{ p[0] }}" class="delete-btn">❌ Delete</a>

</div>
{% endfor %}

</div>

</div>

</body>
</html>
