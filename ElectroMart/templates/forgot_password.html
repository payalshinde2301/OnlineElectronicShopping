<!DOCTYPE html>
<html>
<head>
<title>Forgot Password</title>
<style>
body { font-family: Arial; background:#1e3c72; color:white; display:flex; justify-content:center; align-items:center; height:100vh;}
.box { background:rgba(255,255,255,0.1); padding:30px; border-radius:10px;}
input,button { padding:10px; width:100%; margin:10px 0;}
button { background:orange; border:none;}
</style>
</head>

<body>

<div class="box">
<h2>Forgot Password</h2>

<form method="POST">
    <input type="email" name="email" placeholder="Enter your email" required>
    <button>Continue</button>
</form>

</div>

</body>
</html>
