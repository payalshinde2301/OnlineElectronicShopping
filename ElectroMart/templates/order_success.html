<!DOCTYPE html>
<html>
<head>
<title>Order Success</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #00c853, #64dd17);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* CARD */
.box {
    background: white;
    padding: 40px;
    border-radius: 15px;
    text-align: center;
    width: 350px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    animation: fadeIn 0.6s ease;
}

/* TICK */
.tick {
    font-size: 70px;
    color: #00c853;
    animation: pop 0.5s ease;
}

h2 {
    margin-top: 10px;
}

.order-id {
    margin-top: 10px;
    font-weight: bold;
    color: #333;
}

/* BUTTON */
button {
    margin-top: 20px;
    padding: 12px 20px;
    border: none;
    background: #00c853;
    color: white;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #009624;
}

/* ANIMATION */
@keyframes pop {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>

</head>

<body>

<div class="box">
    <div class="tick">✔</div>
    <h2>Order Placed Successfully!</h2>

    <!-- ✅ ORDER ID -->
    <p class="order-id">Order ID: #{{ order_id }}</p>

    <p>Your order has been confirmed and is being processed.</p>

    <button onclick="goOrders()">View Orders</button>
</div>

<!-- 🎉 CONFETTI -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
// 🎉 Fire confetti
function fireConfetti() {
    confetti({
        particleCount: 150,
        spread: 70,
        origin: { y: 0.6 }
    });
}

// Run once page loads
window.onload = fireConfetti;

// Auto redirect after 4 sec
setTimeout(() => {
    window.location.href = "/orders";
}, 4000);

function goOrders(){
    window.location.href = "/orders";
}
</script>

</body>
</html>
