<!DOCTYPE html>
<html>
<head>
<title>Payment Success</title>

<style>
body {
    background: #f0fff0;
    font-family: Arial;
    text-align: center;
    padding-top: 100px;
}

.box {
    background: white;
    padding: 40px;
    width: 400px;
    margin: auto;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.tick {
    font-size: 60px;
    color: green;
    animation: pop 0.5s ease;
}

@keyframes pop {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
}

button {
    margin-top: 20px;
    padding: 12px;
    background: green;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
</style>

</head>

<body>

<div class="box">
    <div class="tick">✔</div>
    <h2>Payment Successful!</h2>
    <p>Your order is being processed.</p>

    <button onclick="goOrder()">View Orders</button>
</div>

<script>
function goOrder(){
    window.location.href = "/place_order";
}
</script>

</body>
</html>
